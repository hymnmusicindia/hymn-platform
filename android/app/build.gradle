apply plugin: 'com.android.application'
def teamRelease = new groovy.json.JsonSlurper().parse(rootProject.file('team-release.json'))

android {
    namespace 'fun.hymnmusic.team'
    compileSdk 36
    defaultConfig {
        applicationId 'fun.hymnmusic.team'
        minSdk 26
        targetSdk 35
        versionCode teamRelease.versionCode
        versionName teamRelease.versionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }

}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.material:material:1.12.0'
}
