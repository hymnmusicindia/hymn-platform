name: HYMN Admin OS Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/admin/**'
      - '.github/workflows/admin-windows-build.yml'
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/admin/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist
      - run: node tests/package-audit.cjs
      - name: Checksum installer
        shell: pwsh
        run: |
          Get-ChildItem dist/*Setup*.exe | ForEach-Object {
            $checksum = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$checksum  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding utf8
          }
      - uses: actions/upload-artifact@v7
        with:
          name: hymn-admin-os-windows-x64
          path: |
            desktop/admin/dist/*Setup*.exe
            desktop/admin/dist/*Setup*.exe.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
