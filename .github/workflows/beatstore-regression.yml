name: Beatstore regression
on:
  pull_request:
    paths:
      - 'components/beat-*'
      - 'components/producer-beat-grid.tsx'
      - 'lib/beat-*'
      - 'lib/checkout*'
      - 'lib/db.ts'
      - 'lib/validation.ts'
      - 'lib/producer-link*'
      - 'components/customer-dashboard-shell.tsx'
      - 'app/api/producer/beats/**'
      - 'lib/private-storage.ts'
      - 'lib/email/**'
      - 'components/checkout-experience.tsx'
      - 'components/producer-*'
      - 'app/api/beat-purchases/**'
      - 'app/api/cron/release-emails/**'
      - 'app/api/checkout/**'
      - 'scripts/verify-direnote-virtual.ts'
      - 'app/api/beats/**'
      - 'prisma/**'
      - 'scripts/verify-beat*'
      - 'scripts/verify-acquisition-isolated.ts'
      - 'package*.json'
      - '.github/workflows/beatstore-regression.yml'
  push:
    branches: [main]
    paths:
      - 'components/beat-*'
      - 'components/producer-beat-grid.tsx'
      - 'lib/beat-*'
      - 'lib/checkout*'
      - 'lib/db.ts'
      - 'lib/validation.ts'
      - 'lib/producer-link*'
      - 'components/customer-dashboard-shell.tsx'
      - 'app/api/producer/beats/**'
      - 'lib/private-storage.ts'
      - 'lib/email/**'
      - 'components/checkout-experience.tsx'
      - 'components/producer-*'
      - 'app/api/beat-purchases/**'
      - 'app/api/cron/release-emails/**'
      - 'app/api/checkout/**'
      - 'scripts/verify-direnote-virtual.ts'
      - 'app/api/beats/**'
      - 'prisma/**'
      - 'scripts/verify-beat*'
      - 'scripts/verify-acquisition-isolated.ts'
      - 'package*.json'
      - '.github/workflows/beatstore-regression.yml'
permissions:
  contents: read
jobs:
  beatstore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:55473/acquisition_fixture
      DIRECT_URL: postgresql://fixture:fixture@127.0.0.1:55473/acquisition_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --fetch-retries=5 --fetch-timeout=120000
      - run: npx prisma generate
      - run: npm run test:beatstore
      - run: node --import tsx scripts/verify-direnote-virtual.ts --beat-delivery-only
      - run: node --import tsx scripts/verify-direnote-virtual.ts --beat-licensing-only
      - run: node --import tsx scripts/verify-payment-flows-isolated.ts --webhooks-only
      - run: node --conditions=react-server --import tsx scripts/verify-bio-checkout-verification.ts
      - run: node scripts/verify-email.cjs
      - run: node --import tsx scripts/verify-checkout-order-persistence.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:beatstore:browser
