name: Scheduled jobs (frequent)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-frequent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run allowlisted jobs and check results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
        run: node scripts/run-cron-jobs.mjs team-appointments release-emails direnote-ingest-status playlist-reviews team-os studio-automation
