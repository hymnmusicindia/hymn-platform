name: HYMN theme and Studio workspace
on:
  push:
    branches: [main]
    paths: ['components/**', 'app/globals.css', 'app/styles/**', 'app/layout.tsx', 'lib/release-portal.ts', 'lib/studio-navigation.ts', 'lib/beat-store.ts', 'app/api/beats/**', 'scripts/verify-beat-preview-playback.cjs', 'app/(public)/studio/**', 'app/(public)/page.tsx', 'app/(public)/services/page.tsx', 'app/(authenticated)/dashboard/page.tsx', 'scripts/verify-theme-*.cjs', 'scripts/verify-personalized-theme.cjs', 'scripts/verify-header-theme.cjs', 'scripts/verify-hymn-studio-browser.cjs', 'scripts/lib/*.cjs', '.github/workflows/hymn-studio-regression.yml']
  pull_request:
    paths: ['components/**', 'app/globals.css', 'app/styles/**', 'app/layout.tsx', 'lib/release-portal.ts', 'lib/studio-navigation.ts', 'lib/beat-store.ts', 'app/api/beats/**', 'scripts/verify-beat-preview-playback.cjs', 'app/(public)/studio/**', 'app/(public)/page.tsx', 'app/(public)/services/page.tsx', 'app/(authenticated)/dashboard/page.tsx', 'scripts/verify-theme-*.cjs', 'scripts/verify-personalized-theme.cjs', 'scripts/verify-header-theme.cjs', 'scripts/verify-hymn-studio-browser.cjs', 'scripts/lib/*.cjs', '.github/workflows/hymn-studio-regression.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --fetch-retries=5 --fetch-timeout=120000
      - run: npx playwright install --with-deps chromium
      - run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc --noEmit --pretty false
      - run: node scripts/verify-hymn-studio-browser.cjs
      - run: node scripts/verify-header-theme.cjs
      - run: node scripts/verify-theme-surfaces.cjs
      - run: node scripts/verify-theme-components.cjs
      - run: node scripts/verify-theme-contract.cjs
      - run: node scripts/verify-personalized-theme.cjs
      - run: node scripts/verify-beat-preview-playback.cjs
      - run: npm run test:studio-services
      - run: npm run test:navigation-selection
