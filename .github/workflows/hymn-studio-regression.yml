name: HYMN Studio workspace
on:
  push:
    branches: [main]
    paths: ['components/hymn-studio*', 'components/site-header.tsx', 'components/theme-toggle.tsx', 'app/styles/**', 'app/layout.tsx', 'scripts/verify-header-theme.cjs', 'scripts/verify-theme-surfaces.cjs', 'components/music-lifecycle-banner.module.css', 'scripts/lib/text-contrast.cjs', 'components/hymn-portal-root.tsx', 'components/customer-dashboard-shell.tsx', 'components/producer-dashboard-shell.tsx', 'components/portal-layout.tsx', 'components/public-workspace.tsx', 'lib/studio-navigation.ts', 'app/(public)/studio/**', 'app/(authenticated)/dashboard/page.tsx', 'scripts/verify-hymn-studio-browser.cjs', '.github/workflows/hymn-studio-regression.yml']
  pull_request:
    paths: ['components/hymn-studio*', 'components/site-header.tsx', 'components/theme-toggle.tsx', 'app/styles/**', 'app/layout.tsx', 'scripts/verify-header-theme.cjs', 'scripts/verify-theme-surfaces.cjs', 'components/music-lifecycle-banner.module.css', 'scripts/lib/text-contrast.cjs', 'components/hymn-portal-root.tsx', 'components/customer-dashboard-shell.tsx', 'components/producer-dashboard-shell.tsx', 'components/portal-layout.tsx', 'components/public-workspace.tsx', 'lib/studio-navigation.ts', 'app/(public)/studio/**', 'app/(authenticated)/dashboard/page.tsx', 'scripts/verify-hymn-studio-browser.cjs', '.github/workflows/hymn-studio-regression.yml']
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --fetch-retries=5 --fetch-timeout=120000
      - run: npx playwright install --with-deps chromium
      - run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc --noEmit --pretty false
      - run: node scripts/verify-hymn-studio-browser.cjs
      - run: node scripts/verify-header-theme.cjs
      - run: node scripts/verify-theme-surfaces.cjs
      - run: npm run test:studio-services
      - run: npm run test:navigation-selection
