name: Scheduled automation watchdog
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cron-watchdog
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Detect missed, failed and uncertain work
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
        run: node scripts/run-cron-jobs.mjs health
