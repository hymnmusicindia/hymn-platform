name: Scheduled automation watchdog
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cron-watchdog
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recover missed jobs and verify scheduler health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
        run: node scripts/recover-failed-cron-jobs.mjs
