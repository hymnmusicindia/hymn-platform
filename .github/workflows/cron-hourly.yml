name: Scheduled jobs (hourly)

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run allowlisted jobs and check results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
        run: node scripts/run-cron-jobs.mjs direnote-release-sync release-status-sync referral-reconciliation growth-sync draft-reminders engineer-reminders storage-cleanup birthday-notifications direnote-revenue-sync
