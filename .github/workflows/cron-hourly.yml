name: Scheduled jobs (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-hourly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
          # Hostinger's CDN serves a bot challenge (403) to GitHub runner IPs,
          # so connect straight to the origin. Update if the server IP changes.
          ORIGIN: hymnmusic.fun:443:145.79.57.62
        run: |
          set -u
          failed=0
          run_job() {
            code=$(curl --silent --show-error --max-time 300 --resolve "$ORIGIN" \
              -o response.json -w '%{http_code}' \
              -X "$2" -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/$1") || code=000
            echo "--- $1 ($2) HTTP $code"
            head -c 4000 response.json; echo
            [ "$code" = "200" ] || failed=1
          }
          run_job direnote-release-sync GET
          run_job release-status-sync GET
          run_job growth-sync GET
          run_job storage-cleanup POST
          exit $failed
