name: Scheduled jobs (hourly)

on:
  schedule:
    # Off the top of the hour: GitHub delays and drops scheduled runs at :00.
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-hourly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://hymnmusic.fun
        run: |
          set -u
          failed=0
          run_job() {
            code=$(curl --silent --show-error --max-time 300 \
              -o response.json -w '%{http_code}' \
              -X "$2" -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/cron/$1") || code=000
            echo "--- $1 ($2) HTTP $code"
            head -c 4000 response.json; echo
            [ "$code" = "200" ] || failed=1
            # A partial reconciliation still returns 200 with per-release
            # diagnostics. Do not silently report that job as healthy.
            if [ "$1" = "direnote-release-sync" ]; then
              jq -e '.success == true and ((.errorCount // 0) == 0)' response.json >/dev/null || failed=1
            fi
          }
          run_job direnote-release-sync GET
          run_job release-status-sync GET
          run_job growth-sync GET
          run_job storage-cleanup POST
          run_job studio-automation GET
          exit $failed
